<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classe 3-E : Opération Négociation</title>
<meta name="description" content="Fan-jeu ludopédagogique non commercial (Master GPLA) : processus de négociation, communication non verbale et éthique des achats.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : une école à explorer (canevas) sous un bandeau d'état ; les missions s'ouvrent dans une console à deux écrans par-dessus. Un seul thème, volontairement sombre (tableau noir). */
:root{
  --board:#1D3A2E; --board-2:#16302A; --shell:#26262E; --shell-2:#3B3B48;
  --chalk:#F1F0E8; --chalk-2:#B9C7BE;
  --paper:#FFFDF6; --paper-2:#EDEAE0; --ink:#17171C; --ink-2:#575763;
  --koro:#F5C518; --maru:#E8741E; --batsu:#7A3FA0; --ok:#1D7A4C; --ok-soft:#DCF0E4; --bad:#B3261E; --bad-soft:#F7DEDC;
  --f-display:"Mochiy Pop One","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --f-body:"Zen Maru Gothic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board);color:var(--chalk)}
body{font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--koro);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding-block:max(14px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* boutons */
.btn{font-family:var(--f-display);font-size:15px;padding:10px 18px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--koro)}
.btn.small{font-size:13px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--chalk);border-color:var(--chalk-2);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* ---------- monde ---------- */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;margin-bottom:10px}
.hud .brand{font-family:var(--f-display);font-size:15px}
.hud .brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--chalk-2);letter-spacing:.08em;text-transform:uppercase}
.hud .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.gauges{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center}
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.gauge .nm{font-family:var(--f-display);font-size:13px}
.gauge .tr{height:12px;border:2px solid var(--chalk);border-radius:999px;overflow:hidden;background:var(--board-2)}
.gauge .tr span{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge.hp .nm{color:var(--koro)} .gauge.hp .tr span{background:linear-gradient(90deg,var(--maru),var(--koro))}
.gauge.trust .nm{color:#8FD3A8} .gauge.trust .tr span{background:linear-gradient(90deg,#3E8E5E,#8FD3A8)}
.gauge .v{font-family:var(--f-mono);font-size:12px;font-weight:600;white-space:nowrap}
.gauge.hit .tr{animation:shake .4s}
.tokens{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--koro);white-space:nowrap}
.objective{grid-column:1/-1;display:flex;gap:10px;align-items:center;background:var(--board-2);border:2px solid var(--koro);border-radius:10px;padding:8px 12px;font-weight:700}
.objective b{font-family:var(--f-display);font-weight:400;color:var(--koro);font-size:13px;white-space:nowrap}
.teambar{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.teambar span{border:2px solid var(--chalk-2);border-radius:999px;padding:2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.teambar span.turn{background:var(--koro);color:var(--ink);border-color:var(--koro);font-weight:900}
.stage{position:relative;border:4px solid #0E0E12;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 10px 0 rgba(0,0,0,.35)}
#world{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}
.pads{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:12px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button,.abtn{border:3px solid var(--ink);background:var(--shell-2);color:var(--chalk);border-radius:12px;font-family:var(--f-display);font-size:18px;cursor:pointer;touch-action:none;user-select:none}
.dpad button:active,.abtn:active{background:var(--koro);color:var(--ink)}
.abtn{width:84px;height:84px;border-radius:50%;font-size:22px;background:var(--maru);color:var(--ink)}
.controls-help{font-size:13px;color:var(--chalk-2);text-align:center;flex:1}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.4);max-width:min(560px,calc(100vw - 32px));animation:toastIn .3s}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}}

/* ---------- console de mission (deux écrans) ---------- */
#ov{position:fixed;inset:0;z-index:40;overflow-y:auto;background:rgba(8,18,14,.86);backdrop-filter:blur(2px)}
#ov .wrap{padding-block:max(16px,env(safe-area-inset-top,0px)) 40px}
.console{background:linear-gradient(160deg,var(--shell-2),var(--shell));border-radius:26px;padding:14px;box-shadow:0 12px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.08)}
.screen{background:var(--board);border:4px solid #0E0E12;border-radius:12px;padding:16px;min-width:0}
.screen.up{background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.06),transparent 50%)}
.screen.down{background:var(--board-2);display:flex;flex-direction:column;gap:14px}
.hinge{display:flex;justify-content:space-between;align-items:center;height:26px;margin:0 8%}
.hinge i{width:30%;height:10px;border-radius:999px;background:linear-gradient(var(--shell-2),#16161B)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top .brand{font-family:var(--f-display);font-size:15px}
.top .brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--chalk-2);letter-spacing:.08em;text-transform:uppercase}
.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;border:2px solid var(--chalk);border-radius:50%}
.pips i.on{background:var(--koro);border-color:var(--koro)}
.hp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:12px}
.hp-name{font-family:var(--f-display);font-size:13px;color:var(--koro)}
.hp-track{height:14px;border:2px solid var(--chalk);border-radius:999px;overflow:hidden;background:var(--board-2)}
.hp-track span{display:block;height:100%;background:linear-gradient(90deg,var(--maru),var(--koro));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hp-val{font-family:var(--f-mono);font-size:13px;font-weight:600}
.hp.hit .hp-track{animation:shake .4s}
.pad-hint{margin-right:auto;font-size:13px;color:var(--chalk-2)}

.panel{border:3px solid var(--ink);background:var(--paper);border-radius:6px;box-shadow:5px 5px 0 rgba(0,0,0,.45);overflow:hidden}
.panel svg{display:block;width:100%;height:auto}
.scene{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.talk{display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font-family:var(--f-display);font-size:14px;background:var(--koro);color:var(--ink);padding:3px 12px;border-radius:6px}
.bubble{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:26px;padding:18px 22px;font-size:18px;line-height:1.6;min-height:96px;cursor:pointer}
.bubble::before{content:"";position:absolute;left:-19px;top:28px;border:10px solid transparent;border-right:16px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-12px;top:31px;border:7px solid transparent;border-right:12px solid var(--paper)}
.narr{font-family:var(--f-display);font-size:19px;line-height:1.6;padding:20px 24px;border:2px dashed var(--chalk-2);border-radius:10px;cursor:pointer}
.scene.shock .panel{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.act{display:flex;flex-direction:column;gap:16px}
.act-head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.kicker{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--koro)}
.memo .kicker,.sheet .kicker{color:var(--batsu)}
.q{font-size:19px;font-weight:700;line-height:1.45}
.cue{border-left:5px solid var(--koro);background:var(--board-2);padding:10px 14px;font-style:italic;border-radius:0 8px 8px 0}
.cue b{font-style:normal;color:var(--koro);font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:12px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);cursor:pointer;font-weight:700;font-size:16px;display:flex;gap:12px;align-items:flex-start}
.opt b{font-family:var(--f-mono);font-weight:600;min-width:1.4em;color:var(--batsu)}
.opt:hover:not(:disabled){background:#FFF3C4}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.bonus{border-color:var(--maru);background:#FFE9D6}
.feedback{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.feedback .face{border:2px solid var(--ink);border-radius:50%;overflow:hidden;background:var(--paper)}
.feedback .face svg{display:block;width:100%;height:auto}
.feedback.ok{border-color:var(--maru)} .feedback.bad{border-color:var(--batsu)}
.feedback strong{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;margin-bottom:4px}
.hint{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;border:2px dashed var(--chalk-2);border-radius:10px;padding:10px 14px}
.hint .mini{border:2px solid var(--ink);border-radius:50%;overflow:hidden;background:var(--paper)}
.hint .mini svg{display:block;width:100%;height:auto}

.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.list h3{font-size:15px}
.chip{text-align:left;padding:9px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer;font-size:15px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.chip[draggable="true"]{cursor:grab}
.chip .n{font-family:var(--f-mono);font-weight:600;color:var(--batsu)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)} .chip.bad{border-color:var(--bad);background:var(--bad-soft)}
.slot{border:2px dashed var(--chalk-2);border-radius:10px;padding:9px 12px;color:var(--chalk-2);font-size:14px}
.slot.over,.chip.over{outline:3px dashed var(--koro);outline-offset:2px}

.tablewrap{overflow-x:auto;border:3px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{padding:9px 12px;border-bottom:1px solid var(--paper-2);text-align:left;font-variant-numeric:tabular-nums;vertical-align:top}
thead th{background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:400;font-size:14px}

.sheet{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:18px 22px}
.lab{display:flex;flex-direction:column;gap:14px}
.lab .sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lab label{font-weight:900;display:flex;justify-content:space-between;gap:10px}
.lab input[type=range]{width:100%;accent-color:#E8741E}
.zbar{position:relative;height:64px;margin-top:8px}
.zbar .axis{position:absolute;left:0;right:0;top:30px;height:4px;background:var(--ink-2);border-radius:4px}
.zbar .zone{position:absolute;top:22px;height:20px;background:rgba(29,122,76,.35);border:2px solid var(--ok);border-radius:6px}
.zbar .mk{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;font-weight:600;white-space:nowrap;text-align:center}
.zbar .mk i{display:block;width:3px;height:30px;margin:2px auto 0;background:currentColor}
.zbar .mk.s{color:var(--batsu)} .zbar .mk.b{color:var(--ok)} .zbar .mk.o{color:var(--maru)}
.zres{font-weight:900}

/* négociation */
.phases{display:flex;flex-wrap:wrap;gap:6px}
.phases span{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;border:2px solid var(--chalk-2);color:var(--chalk-2)}
.phases span.done{border-color:var(--chalk);color:var(--chalk)}
.phases span.now{background:var(--koro);border-color:var(--koro);color:var(--ink)}
.nego-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:2px solid var(--chalk-2);border-radius:10px;padding:10px 12px}
.stat .lbl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-2)}
.stat .val{font-family:var(--f-mono);font-weight:600;font-size:20px}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:14px;height:14px;border:2px solid var(--chalk);border-radius:50%}
.dots i.on{background:var(--koro);border-color:var(--koro)}
.patience{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.patience .lbl{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-2)}
.micro{position:relative}
.micro.flash .panel{outline:4px solid var(--maru);outline-offset:3px}
.micro .spark{position:absolute;top:6px;right:6px;background:var(--maru);color:var(--ink);font-weight:900;font-size:12px;padding:3px 8px;border-radius:999px}
.insight{border:2px solid var(--maru);background:rgba(232,116,30,.14);border-radius:10px;padding:10px 14px;font-weight:700}
.debrief{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

.timer{height:14px;border:2px solid var(--chalk);border-radius:999px;position:relative;overflow:hidden}
.timer span{position:absolute;inset:0 auto 0 0;background:var(--koro);transition:width .25s linear}
.timer.low span{background:var(--bad)}
.phase-banner{font-family:var(--f-display);text-align:center;padding:6px 12px;border-radius:8px;background:var(--koro);color:var(--ink)}
.phase-banner.p1{background:#5FAF3A} .phase-banner.p2{background:var(--bad);color:var(--paper)}

/* équipes */
.grid-teams{display:flex;flex-direction:column;gap:8px}
.grid-teams h3{font-size:15px}
.tg{display:grid;grid-template-columns:minmax(0,1fr) auto 110px;gap:12px;align-items:center;border:2px solid var(--chalk-2);border-radius:12px;padding:8px 12px}
.tg .tn{font-weight:900;min-width:0}
.tg .tn small{display:block;font-weight:500;color:var(--chalk-2)}
.tg .tl{display:flex;gap:6px}
.tg .tr{font-family:var(--f-mono);font-weight:600;text-align:right}
.lt{width:40px;height:40px;border-radius:50%;border:2px solid var(--chalk);background:transparent;color:var(--chalk);font-family:var(--f-display);cursor:pointer}
.lt.on{background:var(--koro);border-color:var(--koro);color:var(--ink)}
.tg.good{border-color:var(--maru);background:rgba(232,116,30,.14)} .tg.wrong{border-color:var(--batsu);background:rgba(122,63,160,.16)}

/* combat et assaut */
.arena-wrap{position:relative;border:3px solid var(--chalk);border-radius:14px;overflow:hidden;background:#2B2118}
#arena{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
.ammo{font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--koro)}
.track{position:relative;height:76px;border:3px solid var(--chalk);border-radius:14px;background:var(--board-2);overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:rgba(232,116,30,.28);border-left:3px dashed var(--maru);border-right:3px dashed var(--maru)}
.track .crit{position:absolute;top:0;bottom:0;background:rgba(245,197,24,.45)}
.track .target{position:absolute;top:6px;width:64px;height:64px;margin-left:-32px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);background:var(--paper)}
.track .target svg{display:block;width:100%;height:auto}
.strike-btn{font-size:22px;padding:16px 28px}
.blitz-card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:18px 20px;font-size:19px;font-weight:700;min-height:90px}
.blitz-card.flash-ok{border-color:var(--ok);background:var(--ok-soft)} .blitz-card.flash-bad{border-color:var(--bad);background:var(--bad-soft)}
.blitz-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.combo{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:70;background:rgba(10,20,15,.5);animation:fade 1.7s forwards}
.combo div{text-align:center;transform:rotate(-4deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.combo b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,10vw,96px);color:var(--koro);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--maru)}
.combo span{display:inline-block;margin-top:10px;background:var(--paper);color:var(--ink);font-weight:900;padding:6px 14px;border-radius:8px}
@keyframes pop{from{transform:rotate(-4deg) scale(2.4);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}

/* résultats, carnet, titre */
.result{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:center}
.memo{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:18px 22px}
.memo h3{font-size:18px;margin-bottom:10px}
.memo ul,.memo ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.maxim{font-family:var(--f-display);font-size:19px;line-height:1.4;border-left:6px solid var(--koro);padding-left:16px}
.verdict{font-family:var(--f-display);font-size:26px;color:var(--koro)}
.carnet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.carnet .who{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:10px}
.carnet .who .panel{box-shadow:none;border-width:2px}
.copybox textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:13px;border:2px solid var(--ink);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:10px 4px}
.hero h1{font-size:clamp(34px,6.5vw,60px)}
.hero h1 em{font-style:normal;color:var(--koro)}
.hero .lede{font-size:18px;max-width:56ch;margin-top:14px}
.chalkline{height:4px;background:var(--chalk);opacity:.6;border-radius:4px;margin-top:14px;width:70%;transform:rotate(-.6deg)}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cast figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cast figcaption{font-weight:700;font-size:13px;color:var(--chalk-2)}
.cast .big{grid-column:1/-1}
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
.setup fieldset{border:2px solid var(--chalk-2);border-radius:12px;padding:14px 16px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.setup legend{font-family:var(--f-display);padding:0 6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input:not([type=radio]):not([type=checkbox]),.field select{font-family:var(--f-body);font-weight:700;font-size:16px;padding:9px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.radio{display:flex;gap:8px;align-items:flex-start;font-weight:700;cursor:pointer}
.radio input{margin-top:5px;flex:none}
.team-rows{display:flex;flex-direction:column;gap:8px}
.team-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}
.credits{margin-top:24px;font-size:13px;color:var(--chalk-2);max-width:80ch}
.ending{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.ending h1{font-size:clamp(28px,5vw,44px);color:var(--koro)}
.ending .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}

@media (max-width:720px){
  .scene{grid-template-columns:92px minmax(0,1fr);gap:14px}
  .bubble{font-size:16px;padding:14px 16px}
  .bubble::before,.bubble::after{top:18px}
  .act-head{grid-template-columns:64px minmax(0,1fr)}
  .order-grid,.carnet,.setup,.hero,.lab .sliders{grid-template-columns:1fr}
  .result{grid-template-columns:1fr;justify-items:start}
  .result .panel{width:130px}
  .nego-stats{grid-template-columns:1fr 1fr}
  .feedback{grid-template-columns:52px minmax(0,1fr)}
  .gauges{grid-template-columns:1fr}
  .tg{grid-template-columns:minmax(0,1fr) 70px}
  .tg .tl{grid-column:1/-1;grid-row:2}
  .team-row{grid-template-columns:1fr}
  .ending .stats{grid-template-columns:1fr}
  .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .abtn{width:72px;height:72px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="root"></div>
<div id="ov" hidden><div class="wrap" id="app" aria-live="polite"></div></div>

<script>
(function(){
"use strict";
const INK = "#17171C";
const SAVE_KEY = "classe-3e-rpg-v1";
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const root = $("#root"), ov = $("#ov"), app = $("#app");
const HP_MAX = 150;

const FRESH = () => ({ name: "Élève", mode: "solo", answerMode: "all", teams: [], turn: 0, results: {}, best: {}, noTimer: false, assist: false,
  hp: HP_MAX, trust: 6, flags: {}, q: 0, px: 7 * 32 + 16, py: 8 * 32 + 20, tokens: 0, found: {}, lessons: {}, started: false, nego: null, examWin: null, ending: null });
let S = FRESH();
let cur = null;
function load(){ try { const r = localStorage.getItem(SAVE_KEY); if (r) Object.assign(S, JSON.parse(r)); } catch(e){} }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function tx(t){ return String(t).replace(/@name/g, teamsOn() ? "la classe" : S.name); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function eur(n){ return Math.round(n).toLocaleString("fr-FR") + " €"; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function trustAdd(d){ S.trust = clamp(S.trust + d, 0, 10); save(); }

/* ---------- équipes ---------- */
function teamsOn(){ return S.mode === "teams" && S.teams.length > 1; }
function simul(){ return teamsOn() && S.answerMode !== "turns"; }
function award(p){ if (teamsOn() && !simul()){ S.teams[S.turn].pts = Math.round((S.teams[S.turn].pts + p) * 10) / 10; save(); } }
function rotate(){ if (teamsOn() && !simul()){ S.turn = (S.turn + 1) % S.teams.length; save(); } }
function teamBar(){
  if (!teamsOn()) return "";
  const turn = i => !simul() && i === S.turn;
  return `<div class="teambar" aria-label="Scores des équipes">${S.teams.map((t, i) => `<span class="${turn(i) ? "turn" : ""}">${turn(i) ? "▶ " : ""}${esc(t.name)} · ${t.pts.toLocaleString("fr-FR")} pt${t.pts >= 2 ? "s" : ""}</span>`).join("")}</div>`;
}
function turnLine(collective){
  if (!teamsOn()) return "";
  const m = t => `<p style="color:var(--koro);font-weight:900">${t}</p>`;
  if (!simul()) return m(`Au tour de ${esc(S.teams[S.turn].name)} de répondre.`);
  return collective ? m("Activité collective : la classe décide ensemble, sans points d’équipe.") : m("Toutes les équipes répondent : chaque groupe se concerte, puis l’animateur note la lettre de chaque équipe.");
}
function gridHTML(order){
  return `<div class="grid-teams"><h3>Réponses des équipes</h3>${S.teams.map((t, ti) => `<div class="tg" data-t="${ti}"><span class="tn">${esc(t.name)}${t.members ? `<small>${esc(t.members)}</small>` : ""}</span><div class="tl">${order.map((o, k) => `<button class="lt" data-t="${ti}" data-i="${o.i}" aria-label="${esc(t.name)} répond ${"ABCD"[k]}">${"ABCD"[k]}</button>`).join("")}</div><span class="tr"></span></div>`).join("")}</div>`;
}
function wireGrid(picks){
  $$(".lt").forEach(b => b.onclick = () => {
    const ti = +b.dataset.t; picks[ti] = +b.dataset.i;
    $$(`.lt[data-t="${ti}"]`).forEach(x => x.classList.toggle("on", x === b));
  });
}
function revealGrid(picks, ok, pts){
  const res = S.teams.map((t, ti) => {
    const good = picks[ti] === ok;
    if (good) t.pts = Math.round((t.pts + pts) * 10) / 10;
    const row = document.querySelector(`.tg[data-t="${ti}"]`);
    row.classList.add(good ? "good" : "wrong");
    row.querySelector(".tr").textContent = good ? `+${String(pts).replace(".", ",")} pt` : picks[ti] === undefined ? "sans réponse" : "raté";
    return good;
  });
  $$(".lt").forEach(x => x.disabled = true);
  save();
  const tb = $("#app .teambar"); if (tb) tb.outerHTML = teamBar();
  return res;
}
/* le choix « de la classe » en mode affrontement : la réponse la plus donnée */
function majority(picks){
  const c = {}; picks.forEach(p => { if (p !== undefined) c[p] = (c[p] || 0) + 1; });
  let best = null; Object.keys(c).forEach(k => { if (best === null || c[k] > c[best]) best = k; });
  return best === null ? null : +best;
}

/* ---------- PV de Koro-sensei ---------- */
function hpBar(){
  const pct = Math.max(0, S.hp) / HP_MAX * 100;
  return `<div class="hp" aria-label="Points de vie de Koro-sensei"><span class="hp-name">Koro-sensei</span><div class="hp-track"><span style="width:${pct}%"></span></div><span class="hp-val">${S.hp > 0 ? Math.ceil(S.hp) + " / " + HP_MAX + " PV" : "K.O. !"}</span></div>`;
}
function refreshHp(){ const el = $("#app .hp"); if (el){ el.outerHTML = hpBar(); $("#app .hp").classList.add("hit"); } }
function strike(frac, w, collective){
  if (frac <= 0) return;
  let dmg = 2 * frac * (w || 1);
  const combo = simul() && !collective && frac === 1;
  if (combo) dmg += 1 * (w || 1);
  if (!teamsOn()) dmg *= 1.5;
  S.hp = Math.max(0, Math.round((S.hp - dmg) * 10) / 10);
  save(); refreshHp();
  if (combo) flash("COMBO 3-E !", "Toutes les équipes ont trouvé : coup critique !");
}
function flash(big, small){
  const o = document.createElement("div");
  o.className = "combo"; o.setAttribute("role", "status");
  o.innerHTML = `<div><b>${esc(big)}</b><span>${esc(small)}</span></div>`;
  document.body.appendChild(o);
  setTimeout(() => o.remove(), RM ? 1200 : 1700);
}
function toast(t){
  const o = document.createElement("div"); o.className = "toast"; o.setAttribute("role", "status"); o.textContent = t;
  document.body.appendChild(o); setTimeout(() => o.remove(), 3200);
}

/* ---------- portraits (dessins originaux en SVG) ---------- */
const st = `stroke="${INK}" stroke-width="3" stroke-linejoin="round"`;
function frame(bg, inner, label){ return `<svg viewBox="0 0 120 130" role="img" aria-label="${label}"><rect width="120" height="130" fill="${bg}"/>${inner}</svg>`; }
function neck(c){ return `<rect x="52" y="84" width="16" height="16" fill="${c}" ${st}/>`; }
function torso(c){ return `<path d="M8 132 Q12 100 60 96 Q108 100 112 132Z" fill="${c}" ${st}/>`; }
function head(c){ return `<ellipse cx="60" cy="60" rx="29" ry="33" fill="${c}" ${st}/>`; }
function eyes(r){ r = r || 4; return `<ellipse cx="48" cy="62" rx="${r}" ry="${r + 1.5}" fill="${INK}"/><ellipse cx="72" cy="62" rx="${r}" ry="${r + 1.5}" fill="${INK}"/><circle cx="49.5" cy="60" r="1.5" fill="#fff"/><circle cx="73.5" cy="60" r="1.5" fill="#fff"/>`; }
function koro(mood){
  mood = mood || "normal";
  const face = { normal: "#F5C518", ok: "#E8741E", ko: "#7A3FA0", mock: "#F5C518", angry: "#2A1616" }[mood];
  let over = "";
  if (mood === "ok") over = `<circle cx="60" cy="66" r="30" fill="none" stroke="#fff" stroke-width="7"/>`;
  if (mood === "ko") over = `<path d="M34 40 L86 92 M86 40 L34 92" stroke="#fff" stroke-width="7" stroke-linecap="round"/>`;
  if (mood === "mock") over = `<path d="M24 50 H96 M22 62 H98 M24 74 H96 M30 86 H90" stroke="#5FAF3A" stroke-width="6" stroke-linecap="round"/>`;
  const eyeC = mood === "angry" ? "#E33" : INK;
  return frame("#FFF6D6",
    `<path d="M10 132 Q14 104 60 100 Q106 104 110 132Z" fill="#26222E" ${st}/>` +
    `<path d="M20 128 Q24 116 30 128 M40 130 Q44 116 50 130 M70 130 Q76 116 80 130 M90 128 Q96 116 100 128" fill="none" stroke="#F5C518" stroke-width="5" stroke-linecap="round"/>` +
    `<path d="M50 100 L60 112 L70 100 L60 104Z" fill="#E8C34A" stroke="${INK}" stroke-width="2"/>` +
    `<circle cx="60" cy="64" r="38" fill="${face}" ${st}/>` + over +
    `<circle cx="47" cy="56" r="4" fill="${eyeC}"/><circle cx="73" cy="56" r="4" fill="${eyeC}"/>` +
    `<path d="M32 70 Q60 100 88 70 Q60 82 32 70Z" fill="#fff" ${st}/><path d="M40 75 V82 M50 78 V87 M60 79 V89 M70 78 V87 M80 75 V82" stroke="${INK}" stroke-width="1.5"/>` +
    `<path d="M26 34 L60 18 L94 34 L60 46Z" fill="#26222E" ${st}/><path d="M42 36 Q60 30 78 36 L78 42 Q60 36 42 42Z" fill="#26222E" ${st}/><path d="M86 31 L92 48" stroke="#E8C34A" stroke-width="3"/><circle cx="92" cy="50" r="3" fill="#E8C34A"/>`,
    "Koro-sensei");
}
function lefort(rel, micro){
  const line = d => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
  let brows, mouth, extra = "", label;
  if (micro){ brows = line("M41 50 Q47 46 54 50 M66 50 Q73 46 79 50"); mouth = `<ellipse cx="60" cy="82" rx="5" ry="4" fill="${INK}"/>`; label = "Claire Lefort, micro-expression"; }
  else if (rel >= 4){ brows = line("M41 53 Q47 49 54 52 M66 52 Q73 49 79 53"); mouth = `<path d="M48 77 Q60 91 72 77Z" fill="#fff" ${st}/>`; extra = `<ellipse cx="41" cy="73" rx="5" ry="3" fill="#E9967A" opacity=".6"/><ellipse cx="79" cy="73" rx="5" ry="3" fill="#E9967A" opacity=".6"/>`; label = "Claire Lefort, détendue et souriante"; }
  else if (rel >= 2){ brows = line("M41 54 H54 M66 54 H79"); mouth = line("M50 80 Q60 85 70 80"); label = "Claire Lefort, neutre"; }
  else { brows = line("M41 52 L54 57 M66 57 L79 52"); mouth = line("M51 84 Q60 78 69 84"); extra = `<path d="M88 46 Q92 54 88 58 Q84 54 88 46Z" fill="#9AD0F5" stroke="${INK}" stroke-width="1.5"/><path d="M22 132 L50 112 L72 120 L98 104 L104 132Z" fill="#1F6E68" ${st}/>`; label = "Claire Lefort, crispée, bras croisés"; }
  return frame("#D8ECE8",
    `<path d="M28 62 Q24 22 60 20 Q96 22 92 62 Q94 80 86 86 L34 86 Q26 80 28 62Z" fill="#4A2F25" ${st}/>` +
    neck("#E9C3A2") + torso("#1F6E68") + `<path d="M46 98 L60 116 L74 98" fill="#fff" ${st}/>` + head("#E9C3A2") +
    `<path d="M31 54 Q34 28 62 28 Q84 28 89 50 Q70 36 50 40 Q38 44 31 54Z" fill="#4A2F25" ${st}/>` +
    brows + eyes(micro ? 4.5 : 3.6) + mouth + extra, label);
}
const CAST = {
  koro: { name: "Koro-sensei", svg: koro("normal") },
  nagisa: { name: "Nagisa Shiota", svg: frame("#DCE7F7",
    `<path d="M30 60 Q20 80 22 98 Q28 86 34 76Z" fill="#4C7BD9" ${st}/><path d="M90 60 Q100 80 98 98 Q92 86 86 76Z" fill="#4C7BD9" ${st}/>` +
    neck("#F3D7C0") + torso("#F4F4F4") + `<path d="M58 100 L60 126 L62 100Z" fill="#2C3A63"/><path d="M8 132 Q14 108 34 102 L40 132Z M112 132 Q106 108 86 102 L80 132Z" fill="#3B3F4A"/>` + head("#F3D7C0") +
    `<path d="M30 58 Q26 24 60 22 Q94 24 90 58 Q84 40 72 42 L66 32 L58 42 L48 34 L40 46 Q34 48 30 58Z" fill="#4C7BD9" ${st}/>` +
    `<ellipse cx="48" cy="63" rx="5" ry="7" fill="#24346B"/><ellipse cx="72" cy="63" rx="5" ry="7" fill="#24346B"/><circle cx="50" cy="60" r="2" fill="#fff"/><circle cx="74" cy="60" r="2" fill="#fff"/>` +
    `<path d="M54 80 Q60 84 66 80" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`, "Nagisa") },
  karma: { name: "Karma Akabane", svg: frame("#F7DEDA",
    neck("#F1D2B6") + torso("#1E1E24") + `<path d="M46 98 L60 118 L74 98" fill="#F4F4F4" ${st}/>` + head("#F1D2B6") +
    `<path d="M28 60 Q24 22 60 20 Q96 22 92 60 L86 46 L80 54 L74 40 L64 48 L56 36 L46 50 L40 42 L34 54Z" fill="#C8322F" ${st}/>` +
    `<path d="M40 56 L55 60 M65 60 L80 56" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>` +
    `<path d="M42 64 Q48 59 55 63 Q48 67 42 64Z" fill="#B8871F" stroke="${INK}" stroke-width="2"/><path d="M65 63 Q72 59 78 64 Q72 67 65 63Z" fill="#B8871F" stroke="${INK}" stroke-width="2"/>` +
    `<path d="M50 80 Q62 84 72 74" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`, "Karma") },
  karasuma: { name: "Karasuma-sensei", svg: frame("#E1E3E8",
    neck("#E6C4A6") + torso("#22252E") + `<path d="M46 98 L60 120 L74 98Z" fill="#fff" ${st}/><path d="M57 104 L60 126 L63 104Z" fill="#20304F"/>` + head("#E6C4A6") +
    `<path d="M31 54 Q30 24 60 24 Q90 24 89 54 Q86 36 60 34 Q38 34 31 54Z" fill="#111" ${st}/>` +
    `<path d="M40 54 L55 56 M65 56 L80 54" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M43 63 H53 M67 63 H77" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>` +
    `<path d="M52 81 H68" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`, "Karasuma") },
  irina: { name: "Irina Jelavić", svg: frame("#F6E7D2",
    `<path d="M26 60 Q20 18 60 18 Q100 18 94 60 Q104 96 92 118 Q84 96 86 76 L34 76 Q36 96 28 118 Q16 96 26 60Z" fill="#E8C25A" ${st}/>` +
    neck("#F5DCC6") + torso("#8C1D3A") + head("#F5DCC6") +
    `<path d="M31 56 Q30 26 60 24 Q84 24 90 48 Q74 30 56 36 Q40 40 31 56Z" fill="#E8C25A" ${st}/>` +
    eyes(4) + `<path d="M40 56 L46 54 M74 54 L80 56" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/><path d="M52 79 Q60 85 68 79" fill="#C2334D" stroke="${INK}" stroke-width="2"/>`, "Irina") },
  asano: { name: "Le directeur Asano", svg: frame("#E4E2DA",
    neck("#EBCDB0") + torso("#2F2F35") + `<path d="M46 98 L60 120 L74 98Z" fill="#fff" ${st}/><path d="M57 104 L60 126 L63 104Z" fill="#6B1E1E"/>` + head("#EBCDB0") +
    `<path d="M30 56 Q28 22 62 22 Q92 24 90 54 Q84 32 64 34 Q44 32 30 56Z" fill="#6E5E52" ${st}/>` +
    `<path d="M42 62 Q48 59 54 62 M66 62 Q72 59 78 62" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>` +
    `<path d="M48 79 Q60 86 72 79" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`, "Directeur Asano") },
  lefort: { name: "Claire Lefort · Pixelia", svg: lefort(3) }
};

/* ---------- contenu pédagogique ---------- */
const W = { quiz: 1, order: 3, nego: 6, blitz: 2 };
const C1_TABLE = { t: "table", title: "Fiche de préparation · 30 ordinateurs portables",
  head: ["Information", "Valeur", "Source"],
  rows: [["Offre de Datalis, conditions identiques", "1 190 € HT / poste", "Devis reçu"], ["Offre d’ouverture de Pixelia", "1 250 € HT / poste", "Devis reçu"], ["Coût de revient estimé chez Pixelia", "≈ 980 € / poste", "Étude de marché"], ["Marge minimale d’un revendeur (secteur)", "≈ 8 %", "Étude de marché"], ["Prix constaté pour ce modèle par lots de 25 à 50", "1 020 à 1 120 € HT", "Comparateurs B2B"]],
  note: "Toutes ces données sont fictives, construites pour l’exercice." };

const CH = {
c0: { title: "Prologue", label: "Prologue",
  steps: [
    { t: "narr", txt: "Collège Kunugigaoka. Le bâtiment de la classe 3-E, perdu en haut de la colline. Ce matin, un professeur jaune écrit au tableau à Mach 20 : NÉGOCIATION." },
    { t: "say", who: "koro", fx: "shock", txt: "Nurufufu ! Bonjour, chers élèves ! Cette année, en plus des maths, je vous apprends l’art de la négociation d’achat." },
    { t: "say", who: "koro", txt: "Notre accord : à l’examen final, au gymnase, vous pourrez m’attaquer. Chaque leçon réussie me fait perdre des forces. Si vous me mettez K.O., je me laisse atteindre." },
    { t: "say", who: "karasuma", txt: "Et voici un vrai dossier. Une filiale française d’un groupe partenaire doit acheter 30 ordinateurs portables. Budget : 36 000 € HT. Vous menez l’achat de bout en bout." },
    { t: "say", who: "koro", txt: "Mais avant de m’affronter, faites le tour de vos camarades. Chacun a un secret de négociation à vous apprendre. Revenez me voir ensuite : je vous ferai passer le test ! Nurufufu." },
    { t: "say", who: "nagisa", txt: "Déplace-toi avec les flèches (ou Z Q S D), et parle aux gens avec E ou Espace. Va voir Karma, Karasuma-sensei, Irina… et moi ! Suis les « ! » jaunes." }
  ] },
/* ----- la tournée des leçons (avant le test de Koro-sensei) -----
   Les étapes marquées ex: true sont les exemples concrets : on peut les retirer sans rien casser. */
l1: { title: "C’est quoi, négocier ?", label: "Leçon de Nagisa", mentor: "nagisa",
  memo: [
    "Négocier, c’est chercher un accord quand il existe à la fois un intérêt commun (on veut conclure) et un désaccord (prix, délai, garantie…).",

  ],
  steps: [
    { t: "say", who: "nagisa", txt: "Salut @name ! Avant le test de Koro-sensei, je t’explique la base : négocier, c’est chercher un accord avec quelqu’un quand on a à la fois un intérêt commun et un désaccord." },
    { t: "say", who: "nagisa", ex: true, txt: "Exemple : il reste une seule part de pizza et on est deux. On peut la couper en deux… ou se parler. Moi, j’adore la croûte ; toi, tu préfères la garniture. En discutant, chacun repart avec ce qu’il voulait vraiment." },
    { t: "say", who: "nagisa", txt: "Sans intérêt commun, il n’y a rien à négocier : on s’en va. Sans désaccord, pas besoin de négocier : on signe. En achats, l’acheteur et le fournisseur veulent tous les deux conclure, mais pas aux mêmes conditions." },
    { t: "quiz", who: "nagisa", practice: true, q: "Dans quelle situation y a-t-il vraiment une négociation ?",
      opts: ["Un fournisseur et un acheteur veulent tous deux signer, mais pas au même prix.", "Tu achètes un ticket de bus à un automate.", "Deux entreprises qui n’ont aucun intérêt à travailler ensemble."], ok: 0,
      why: "Il faut les deux ingrédients : un intérêt commun (signer) et un désaccord (le prix). L’automate ne discute pas, et sans intérêt commun personne ne reste à la table." },
    { t: "say", who: "nagisa", txt: "Bien joué ! Je note ça dans mon carnet pour toi. Va voir les autres : chacun a sa leçon." }

l2: { title: "Position ou intérêt ?", label: "Leçon de Karma", mentor: "karma",
  memo: [
    "La position, c’est ce que l’autre réclame (« je veux 1 250 € ») ; l’intérêt, c’est la raison pour laquelle il le réclame (« je dois atteindre mon objectif »).",

l4: { title: "L’ancrage et la ZOPA", label: "Leçon d’Irina", mentor: "irina",
  memo: [
    "Ancrage : le premier chiffre annoncé influence toute la discussion. Celui qui ouvre fixe le point de départ.",
    "ZOPA : zone d’accord possible, entre le prix minimum du vendeur et le prix maximum de l’acheteur. Si elles ne se croisent pas, pas d’accord possible.",
    "On ouvre de façon ambitieuse mais crédible, avec une justification. On ne révèle jamais son prix limite."

  steps: [
    { t: "say", who: "irina", txt: "Écoute bien, mon petit. Le premier chiffre annoncé influence toute la discussion : c’est l’ancrage. Celui qui ouvre fixe le point de départ." },

    { t: "say", who: "irina", txt: "Ensuite, la ZOPA : la zone d’accord possible. Elle va du prix minimum du vendeur au prix maximum de l’acheteur. Si ces deux limites ne se croisent pas, aucun accord n’est possible." },
    { t: "say", who: "irina", ex: true, txt: "Exemple : le vendeur du vélo ne descendra pas sous 150 €, et toi tu ne paieras pas plus de 180 €. Tout accord entre 150 et 180 € est possible : c’est la ZOPA." },
    { t: "quiz", who: "irina", practice: true, q: "Le vendeur ne descend pas sous 150 €. Toi, tu ne veux pas payer plus de 180 €. Où se trouve la ZOPA ?",

      why: "La ZOPA va du prix limite du vendeur (150 €) au prix limite de l’acheteur (180 €). En dessous, le vendeur refuse ; au-dessus, c’est toi qui refuses." },
    { t: "say", who: "irina", txt: "Dernier conseil : ouvre de façon ambitieuse mais crédible, toujours avec une justification. Et ne révèle jamais ton prix limite. Jamais." }
  ] },

/* ---------- moteur des missions ---------- */
let typing = null;
function stopType(){ if (typing){ clearInterval(typing.t); typing = null; } }
function typeInto(node, text){
  stopType();
  node.setAttribute("aria-label", text);
  if (RM){ node.textContent = text; return; }
  node.textContent = "";
  let i = 0;
  typing = { node, text, t: setInterval(() => { i += 2; node.textContent = text.slice(0, i); if (i >= text.length) stopType(); }, 16) };
}
function finishType(){ if (!typing) return false; const t = typing; stopType(); t.node.textContent = t.text; return true; }

const SPLIT = "<!--SPLIT-->";
const timers = new Set();
function every(fn, ms){ const id = setInterval(fn, ms); timers.add(id); return id; }
function clearTimers(){ timers.forEach(id => clearInterval(id)); timers.clear(); }

function chap(){ return CH[cur.id]; }
function shell(inner){
  stopType();
  let label = "Mission";
  let right = `<button class="btn small ghost" id="quit">Retour à l’école</button>`;
  if (cur){
    const ch = chap();
    label = `${ch.label} · ${ch.title}`;
    right = `<div class="pips" aria-label="Avancement">${ch.steps.map((_, i) => `<i class="${i <= cur.i ? "on" : ""}"></i>`).join("")}</div>` + right;
  }
  const head = `<header class="top"><div class="brand">Classe 3-E : Opération Négociation<small>${esc(label)}</small></div><div class="right">${right}</div></header>${hpBar()}${teamBar()}`;
  const cut = inner.indexOf(SPLIT);
  if (cut < 0) return `<div class="console"><div class="screen up">${head}${inner}</div></div>`;
  return `<div class="console"><div class="screen up">${head}${inner.slice(0, cut)}</div><div class="hinge" aria-hidden="true"><i></i><i></i></div><div class="screen down">${inner.slice(cut + SPLIT.length)}</div></div>`;
}
function paint(html, keepScroll){
  const y = ov.scrollTop;
  ov.hidden = false;
  app.innerHTML = shell(html);
  const q = $("#quit"); if (q) q.onclick = () => closeMission(false);
  ov.scrollTop = keepScroll ? y : 0;
}
function closeMission(done){
  clearTimers(); stopType();
  const id = cur && cur.id;
  cur = null; ov.hidden = true; app.innerHTML = "";
  if (done && id) advanceQuest(id);
  save(); drawHud();
}
function startChapter(id){
  const ch = CH[id];
  clearTimers();
  cur = { id, i: 0, pts: 0, max: ch.steps.reduce((a, s) => a + (W[s.t] || 0), 0), result: null, nego: null, duel: null, assaulted: false };
  step();
}
function step(){
  const ch = chap();
  let s = ch.steps[cur.i];
  while (s && ((s.if && s.if !== cur.result) || (s.cond && !s.cond()))){ cur.i++; s = ch.steps[cur.i]; }
  if (!s) return finishChapter();
  clearTimers();
  R[s.t](s);
}
function next(){ cur.i++; step(); }

  if (s.hint) $("#hb").onclick = () => {

};

R.order = s => {
  const pool = shuffle(s.items);
  const picked = [];
  let hintUsed = false, done = false, good = 0, first = true;
  function draw(){
    paint(`<section class="act">${turnLine(true)}<div class="act-head">${portraitHead(s.who)}<div><div class="kicker">Mini-jeu · Remise en ordre</div><p class="q">${esc(s.q)}</p><p style="color:var(--chalk-2);font-size:14px">Glisse les étapes vers les cases, ou touche-les dans l’ordre. Touche une étape placée pour la retirer.</p></div></div></section>${SPLIT}<section class="act">
      <div class="order-grid">
        <div class="list"><h3>Étapes à placer</h3>${pool.filter(p => !picked.includes(p)).map(p => `<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join("") || `<p style="color:var(--chalk-2)">Toutes les étapes sont placées.</p>`}</div>
        <div class="list"><h3>Ton processus</h3>${s.items.map((_, i) => picked[i] ? `<button class="chip ${done ? (picked[i] === s.items[i] ? "ok" : "bad") : ""}" data-r="${i}" data-drop="${i}"><span class="n">${i + 1}</span><span>${esc(picked[i])}${done && picked[i] !== s.items[i] ? `<br><small>Attendu : ${esc(s.items[i])}</small>` : ""}</span></button>` : `<div class="slot" data-drop="${i}">${i + 1}. …</div>`).join("")}</div>
      </div>
      <div id="hint">${hintUsed ? hintBox(s.hint) : ""}</div><div id="fb">${done ? feedback(good === s.items.length, `${good} étape${good > 1 ? "s" : ""} sur ${s.items.length} à la bonne place.`, good === s.items.length ? "Processus parfait !" : "Regarde l’ordre attendu sous chaque étape en rouge.") : ""}</div>
      <div class="row end">${!done && !hintUsed ? `<button class="btn small ghost" id="hb">${hintButton()}</button>` : ""}${!done ? `<button class="btn primary" id="ok" ${picked.length < s.items.length ? "disabled" : ""}>Valider</button>` : `<button class="btn primary" id="nx">Suite ▸</button>`}</div></section>`, !first);
    first = false;
    if (done){ $("#nx").onclick = () => { rotate(); next(); }; return; }
    $$("[data-p]").forEach(b => b.onclick = () => { picked.push(b.dataset.p); draw(); });
    $$("[data-r]").forEach(b => b.onclick = () => { picked.splice(+b.dataset.r, 1); draw(); });
    $$("[data-p],[data-r]").forEach(el => {
      el.draggable = true;
      el.ondragstart = e => e.dataTransfer.setData("text/plain", el.dataset.p !== undefined ? "p|" + el.dataset.p : "r|" + el.dataset.r);
    });
    $$("[data-drop]").forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
      z.ondragleave = () => z.classList.remove("over");
      z.ondrop = e => {
        e.preventDefault();
        const raw = e.dataTransfer.getData("text/plain"), c = raw.indexOf("|");
        const item = raw.slice(0, c) === "r" ? picked.splice(+raw.slice(c + 1), 1)[0] : raw.slice(c + 1);
        if (!item) return;
        picked.splice(Math.min(+z.dataset.drop, picked.length), 0, item);
        draw();
      };
    });
    if ($("#hb")) $("#hb").onclick = () => { hintUsed = true; if (S.tokens > 0){ S.tokens--; s._free = true; save(); } draw(); };
    $("#ok").onclick = () => {
      done = true;
      good = picked.filter((p, i) => p === s.items[i]).length;
      const g = Math.max(0, W.order * good / s.items.length - (hintUsed && !s._free ? 0.5 : 0));
      cur.pts += g; award(Math.round(g * 10) / 10);
      draw();
      strike(good / s.items.length, 5 / 3, true);
    };
  }
  draw();
};

R.blitz = s => {
  const items = shuffle(s.items);
  let i = 0, good = 0, left = s.time, over = false, first = true;
  const log = [];
  function draw(){
    const it = items[i];
    paint(`<section class="act">${turnLine(true)}<div class="act-head">${portraitHead(s.who)}<div><div class="kicker">Entraînement éclair · ${esc(s.title)}</div><p class="q">${esc(s.q)}</p></div></div>
      <p class="blitz-count" style="font-family:var(--f-mono);font-weight:600">Carte ${i + 1} / ${items.length} · ${good} bonne${good > 1 ? "s" : ""} réponse${good > 1 ? "s" : ""}</p>
      ${S.noTimer ? "" : `<div class="timer" id="tm"><span style="width:${Math.max(0, left) / s.time * 100}%"></span></div>`}
      <div class="blitz-card" id="card">${esc(it.t)}</div></section>${SPLIT}<section class="act"><div class="blitz-choices">${s.choices.map((c, k) => `<button class="btn" data-c="${k}">${esc(c)}</button>`).join("")}</div></section>`, !first);
    first = false;
    $$("[data-c]").forEach(b => b.onclick = () => answer(+b.dataset.c));
  }
  function answer(k){
    if (over) return;
    const it = items[i], ok = k === it.a;
    if (ok) good++;
    log.push({ it, ok });
    $("#card").classList.add(ok ? "flash-ok" : "flash-bad");
    $$("[data-c]").forEach(b => b.disabled = true);
    setTimeout(() => { if (over) return; i++; if (i < items.length) draw(); else finish(); }, RM ? 250 : 550);
  }
  function finish(){
    if (over) return;
    over = true; clearTimers();
    const g = W.blitz * good / items.length;
    cur.pts += g; award(Math.round(g * 10) / 10);
    const missed = items.slice(log.length).map(it => ({ it, ok: false }));
    paint(`<section class="act"><div class="act-head">${portraitHead("koro", good / items.length >= 0.7 ? "ok" : "ko")}<div><div class="kicker">Entraînement éclair · bilan</div><p class="q">${good} / ${items.length} bonnes réponses${log.length < items.length ? " (temps écoulé)" : ""}</p></div></div></section>${SPLIT}<section class="act">
      <div class="memo"><ul class="debrief">${log.concat(missed).map(l => `<li><b>${l.ok ? "✓" : "✗"} ${esc(l.it.t)}</b><br>Réponse : ${esc(s.choices[l.it.a])}. ${esc(l.it.why)}</li>`).join("")}</ul></div>
      <div class="row end"><button class="btn primary" id="nx">Suite ▸</button></div></section>`);
    strike(good / items.length, 4 / 3, true);
    $("#nx").onclick = next;
  }
  draw();
  if (!S.noTimer) every(() => {
    left -= 0.25;
    const tm = $("#tm");
    if (tm){ tm.firstChild.style.width = (Math.max(0, left) / s.time * 100) + "%"; tm.classList.toggle("low", left <= 8); }
    if (left <= 0) finish();
  }, 250);
};

/* Négociation en temps réel : patience, micro-expressions, conséquences */
R.nego = () => {
  const s = cur.nego || (cur.nego = { price: 1250, warranty: 1, rel: S.flags.gift ? 4 : 3, proc: 0, node: "open", reply: null, end: false, note: [], scored: false, seen: 0, missed: 0 });
  const fix = () => { s.rel = clamp(s.rel, 0, 5); };
  const PAT = teamsOn() ? 35 : 18;
  function stats(){
    const ph = s.end ? 7 : NEGO[s.node].ph;
    return `<div class="phases" aria-label="Phases de la négociation">${PHASES.map((p, i) => `<span class="${i < ph ? "done" : i === ph ? "now" : ""}">${i + 1}. ${p}</span>`).join("")}</div>
      <div class="nego-stats">
        <div class="stat"><div class="lbl">Prix par poste</div><div class="val">${eur(s.price)}</div></div>
        <div class="stat"><div class="lbl">Garantie</div><div class="val">${s.warranty} an${s.warranty > 1 ? "s" : ""}</div></div>
        <div class="stat"><div class="lbl">Objectif / limite</div><div class="val">1 080 / 1 190</div></div>
        <div class="stat"><div class="lbl">Relation</div><div class="dots">${[0,1,2,3,4].map(i => `<i class="${i < s.rel ? "on" : ""}"></i>`).join("")}</div></div>
      </div>`;
  }
  function draw(){
    fix(); clearTimers();
    if (s.end) return debrief();
    const n = NEGO[s.node];
    const cue = s.node === "conc" ? (s.interest ? "Quand tu évoques la suite de la relation, elle se penche en avant et rouvre son carnet." : "Elle s’adosse et repose son stylo.") : n.cue;
    const said = (s.reply ? s.reply + " " : "") + n.line + (s.node === "close" && S.flags.gift ? " Et on se revoit au match, n’est-ce pas ?" : "");
    let insight = false, microOn = false, left = PAT, waited = 0;
    const when = 2 + Math.random() * 4;
    paint(`<section class="act">${turnLine(true)}${stats()}
      <div class="patience"${S.noTimer ? " hidden" : ""}><span class="lbl">Patience</span><div class="timer" id="tm"><span style="width:100%"></span></div></div>
      <div class="scene"><div class="micro" id="mic"><div class="panel" id="lf">${lefort(s.rel)}</div></div><div class="talk"><div class="tag">${esc(CAST.lefort.name)}</div><div class="bubble" id="bub"></div>${cueBox(cue)}<div id="ins"></div></div></div></section>${SPLIT}<section class="act">
      <div class="row"><div class="kicker" style="margin-right:auto">Ta réplique</div>${n.micro ? `<button class="btn small" id="obs">Observer (O)</button>` : ""}</div>
      <div class="opts" id="opts">${n.opts.map((o, i) => `<button class="opt" data-o="${i}"><b>${"ABC"[i]}</b><span>${esc(o.t)}</span></button>`).join("")}</div></section>`);
    typeInto($("#bub"), said);
    $("#bub").onclick = () => finishType();
    const choose = f => { finishType(); clearTimers(); s.reply = f(s); rotate(); draw(); };
    $$("[data-o]").forEach(b => b.onclick = () => choose(n.opts[+b.dataset.o].f));
    if (n.micro){
      const obs = () => {
        if (insight) return;
        if (microOn){
          insight = true; s.seen++;
          $("#ins").innerHTML = `<div class="insight">Bien vu : ${esc(n.micro.cue)} ${esc(n.micro.insight)}</div>`;
          if (n.micro.bonus){
            const b = document.createElement("button");
            b.className = "opt bonus"; b.innerHTML = `<b>★</b><span>${esc(n.micro.bonus.t)}</span>`;
            b.onclick = () => choose(n.micro.bonus.f);
            $("#opts").prepend(b);
          }
          $("#obs").disabled = true;
        } else {
          $("#ins").innerHTML = `<div class="insight" style="border-color:var(--chalk-2);background:transparent">Rien de particulier pour l’instant… Observe son visage et réessaie au bon moment.</div>`;
        }
      };
      $("#obs").onclick = obs;
      window.__obs = obs;
    } else window.__obs = null;
    every(() => {
      waited += 0.1;
      if (n.micro && !microOn && !insight && waited >= when && waited < when + 1.4){
        microOn = true;
        const lf = $("#lf"); if (lf) lf.innerHTML = lefort(s.rel, true);
        const m = $("#mic"); if (m){ m.classList.add("flash"); }
      }
      if (microOn && waited >= when + 1.4){
        microOn = false; if (!insight) s.missedNow = true;
        const lf = $("#lf"); if (lf) lf.innerHTML = lefort(s.rel);
        const m = $("#mic"); if (m) m.classList.remove("flash");
      }
      if (S.noTimer) return;
      left -= 0.1;
      const tm = $("#tm"); if (tm){ tm.firstChild.style.width = Math.max(0, left / PAT * 100) + "%"; tm.classList.toggle("low", left <= 5); }
      if (left <= 0){
        left = PAT; s.rel--; fix();
        s.note.push("Hésitation trop longue : elle a tapoté la table, la relation a baissé.");
        const lf = $("#lf"); if (lf) lf.innerHTML = lefort(s.rel);
        $("#ins").innerHTML = `<div class="insight" style="border-color:var(--bad)">Elle tapote la table : « Je n’ai pas toute la journée. » La relation baisse.</div>`;
      }
    }, 100);
  }
  function debrief(){
    const priceScore = clamp((1190 - s.price) / (1190 - 1080), 0, 1) * 35;
    let score = priceScore + (s.warranty >= 3 ? 10 : 0) + Math.max(0, s.proc) / 7 * 30 + s.rel * 2 + (s.recap ? 10 : 0) + Math.min(5, s.seen * 2)
      - (s.lie ? 15 : 0) - (s.bribe ? 25 : 0) - (s.rush ? 10 : 0) - (s.reveal ? 10 : 0);
    score = clamp(Math.round(score), 0, 100);
    const first = !s.scored;
    if (first){ s.scored = true; const g = W.nego * score / 100; cur.pts += g; award(Math.round(g * 10) / 10); S.nego = { price: s.price, score, warranty: s.warranty }; save(); }
    const verdict = s.price <= 1080 ? "Objectif atteint." : s.price <= 1190 ? "Accord dans la ZOPA, au-dessus de ton objectif." : "Au-dessus de ton prix limite : ta MESORE (Datalis) était meilleure.";
    if (s.seen) s.note.push(`Micro-expressions repérées : ${s.seen}. Chacune t’a donné une information que les mots ne disaient pas.`);
    if (S.flags.gift) s.note.push("Le cadeau accepté a rendu Claire plus aimable… mais tu lui dois quelque chose, et ça se verra.");
    paint(`<section class="act">${stats()}<div class="act-head">${portraitHead("koro", score >= 70 ? "ok" : score >= 45 ? "mock" : "ko")}<div><div class="kicker">Débrief de Koro-sensei</div><p class="q">Score de négociation : ${score} / 100</p><p>Prix final ${eur(s.price)} par poste, soit ${eur(s.price * 30)} HT pour 30 postes. ${verdict}</p></div></div></section>${SPLIT}<section class="act">
      <div class="memo"><h3>Phase par phase</h3><ul class="debrief">${s.note.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>
      <div class="row end"><button class="btn ghost" id="redo">Rejouer la négociation</button><button class="btn primary" id="nx">Suite ▸</button></div></section>`);
    if (first) strike(score / 100, 10 / 3, true);
    $("#redo").onclick = () => { cur.pts = 0; cur.nego = null; R.nego(); };
    $("#nx").onclick = next;
  }
  draw();
};

/* Examen final : questions → munitions → tir sur Koro-sensei */
R.combat = () => {
  const sim = simul();
  const d = cur.duel || (cur.duel = { i: -1, ammo: 0, right: 0, ts: S.teams.map(() => 0), hits: 0, qs: DUEL.map(q => ({ ...q, order: shuffle(q.opts.map((t, i) => ({ t, i }))) })) });
  const phase = () => d.i < 4 ? 0 : d.i < 8 ? 1 : 2;
  function ranking(){

    return `<div class="memo"><h3>Classement de l’examen</h3><ol>${rows.map(r => `<li><b>${esc(r.n)}</b> : ${r.v} / ${DUEL.length}</li>`).join("")}</ol></div>`;
  }
  function intro(){
    paint(`<section class="act"><div class="act-head">${portraitHead("koro", "mock")}<div><div class="kicker">Examen final · gymnase</div><p class="q">12 questions, 6 manches de tir.</p></div></div></section>${SPLIT}<section class="act">
      <div class="memo"><h3>Règles</h3><ul>
        <li>Chaque bonne réponse donne des billes anti-sensei${sim ? " : 2 par équipe qui trouve, 3 de bonus si toutes les équipes trouvent" : " : 4 par bonne réponse"}.</li>
        <li>Toutes les 2 questions, une manche de tir de 8 secondes. Clique (ou touche) Koro-sensei pour tirer.</li>
        <li>Il esquive tout… sauf quand il s’arrête pour se moquer de vous (rayures vertes) : c’est là qu’il faut tirer.</li>
        <li>3 phases : il accélère à Mach 10, puis à Mach 20. Mets ses PV à zéro avant la fin pour réussir l’assassinat.</li>
      </ul></div>
      <div class="row"><label class="toggle"><input type="checkbox" id="opt-notimer" ${S.noTimer ? "checked" : ""}> Questions sans chrono</label><label class="toggle"><input type="checkbox" id="opt-assist" ${S.assist ? "checked" : ""}> Tir assisté (cible plus grande, pauses plus longues)</label></div>
      <div class="row end"><button class="btn primary" id="go">Commencer l’examen</button></div></section>`);
    $("#opt-notimer").onchange = e => { S.noTimer = e.target.checked; save(); };
    $("#opt-assist").onchange = e => { S.assist = e.target.checked; save(); };
    $("#go").onclick = () => { d.i = 0; ask(); };
  }
  function ask(){
    const q = d.qs[d.i], ph = phase(), T = BOSS[ph].time;
    let left = T, answered = false;
    paint(`<section class="act"><div class="phase-banner p${ph}">${BOSS[ph].label}</div>${turnLine()}
      <div class="row"><span class="ammo">Billes : ${d.ammo}</span><span style="margin-left:auto;color:var(--chalk-2)">Question ${d.i + 1} / ${d.qs.length}</span></div>
      <p class="q">${esc(q.q)}</p>
      ${S.noTimer ? "" : `<div class="timer" id="tm"><span style="width:100%"></span></div>`}</section>${SPLIT}<section class="act">
      <div class="opts">${q.order.map((o, k) => `<button class="opt" data-i="${o.i}" ${sim ? "disabled" : ""}><b>${"ABCD"[k]}</b><span>${esc(o.t)}</span></button>`).join("")}</div>
      ${sim ? gridHTML(q.order) : ""}
      <div id="fb"></div><div class="row end">${sim ? `<button class="btn primary" id="rev">Révéler la réponse</button>` : ""}<button class="btn primary" id="nx" hidden>Suite ▸</button></div></section>`);
    const picks = [];
    function resolve(choice){
      if (answered) return; answered = true; clearTimers();
      let ok, title, gain = 0;
      if (sim){
        const res = revealGrid(picks, q.ok, 1), n = res.filter(Boolean).length;
        res.forEach((g, i) => { if (g) d.ts[i]++; });
        gain = n * 2 + (n === S.teams.length ? 3 : 0);
        if (n === S.teams.length) flash("COMBO 3-E !", "+3 billes de bonus");
        ok = n > 0; title = `${n} équipe${n > 1 ? "s" : ""} sur ${S.teams.length} ${n > 1 ? "ont" : "a"} trouvé. `;
        if (n) d.right++;
        $("#rev").hidden = true;
      } else {
        ok = choice === q.ok;
        if (ok){ gain = 4; d.right++; award(1); }
        title = choice === null ? "Temps écoulé ! " : ok ? "Bonne réponse ! " : "Raté. ";
      }
      d.ammo += gain;
      $$(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === q.ok) x.classList.add("ok"); else if (+x.dataset.i === choice) x.classList.add("bad"); });
      $(".ammo").textContent = `Billes : ${d.ammo}`;
      $("#fb").innerHTML = feedback(ok, title + (gain ? `+${gain} billes.` : "Pas de billes cette fois."), "");
      const shootNow = d.i % 2 === 1 || d.i === d.qs.length - 1;
      $("#nx").hidden = false; $("#nx").textContent = shootNow ? "Manche de tir ▸" : "Question suivante ▸";
      $("#nx").focus({ preventScroll: true });
      $("#nx").onclick = () => { rotate(); if (shootNow) shoot(); else { d.i++; ask(); } };
    }
    if (sim){ wireGrid(picks); $("#rev").onclick = () => resolve(null); }
    else $$(".opt").forEach(b => b.onclick = () => resolve(+b.dataset.i));
    if (!S.noTimer){
      every(() => {
        const tm = $("#tm"); if (!tm) return;
        left -= 0.25; tm.firstChild.style.width = (left / T * 100) + "%"; tm.classList.toggle("low", left <= 4);
        if (left <= 0) resolve(null);
      }, 250);
    }
    if (d.i === 4 || d.i === 8) flash(BOSS[ph].big, BOSS[ph].label);
  }
  function shoot(){
    const ph = phase(), P = BOSS[ph], A = S.assist ? 1.35 : 1;
    const Wd = 900, Hd = 380, R0 = 44 * A;
    paint(`<section class="act"><div class="phase-banner p${ph}">${P.label}</div>
      <div class="row"><span class="ammo" id="am">Billes : ${d.ammo}</span><span id="tl" style="margin-left:auto;font-family:var(--f-mono)">8,0 s</span></div>
      <div class="arena-wrap"><canvas id="arena" width="${Wd}" height="${Hd}" aria-label="Arène : Koro-sensei se déplace, clique pour tirer"></canvas></div></section>${SPLIT}<section class="act">
      <p>Tire quand il s’arrête pour se moquer (rayures vertes). Ailleurs, il esquive à Mach ${[5, 10, 20][ph]}.</p>
      <div class="row end"><button class="btn ghost" id="skip">Terminer la manche</button></div></section>`);
    const cv = $("#arena"), g = cv.getContext("2d");
    const k = { x: Wd / 2, y: Hd / 2, tx: Wd / 2, ty: Hd / 2, mock: 0, hurt: 0 };
    const ghosts = [], floats = [];
    let left = 8, last = null, over = false, raf = 0, aim = { x: -99, y: -99 };
    const pick = () => { k.tx = 80 + Math.random() * (Wd - 160); k.ty = 70 + Math.random() * (Hd - 140); };
    pick();
    function drawKoro(x, y, r, alpha, mock, hurt){
      g.save(); g.globalAlpha = alpha;
      g.fillStyle = "#26222E"; g.beginPath(); g.moveTo(x - r * 0.9, y + r * 1.6); g.quadraticCurveTo(x, y + r * 0.4, x + r * 0.9, y + r * 1.6); g.fill();
      g.strokeStyle = "#F5C518"; g.lineWidth = 5; for (let t = -2; t <= 2; t++){ g.beginPath(); g.moveTo(x + t * r * 0.35, y + r * 1.3); g.quadraticCurveTo(x + t * r * 0.45 + Math.sin(performance.now() / 120 + t) * 6, y + r * 1.7, x + t * r * 0.4, y + r * 1.95); g.stroke(); }
      g.fillStyle = hurt > 0 ? "#E8741E" : "#F5C518"; g.strokeStyle = INK; g.lineWidth = 3;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.stroke();
      if (mock){ g.save(); g.beginPath(); g.arc(x, y, r - 2, 0, Math.PI * 2); g.clip(); g.strokeStyle = "#5FAF3A"; g.lineWidth = 7; for (let yy = -r; yy < r; yy += 13){ g.beginPath(); g.moveTo(x - r, y + yy); g.lineTo(x + r, y + yy); g.stroke(); } g.restore(); }
      g.fillStyle = INK; g.beginPath(); g.arc(x - r * 0.33, y - r * 0.2, r * 0.1, 0, 7); g.arc(x + r * 0.33, y - r * 0.2, r * 0.1, 0, 7); g.fill();
      g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x - r * 0.65, y + r * 0.15); g.quadraticCurveTo(x, y + r * 0.95, x + r * 0.65, y + r * 0.15); g.quadraticCurveTo(x, y + r * 0.45, x - r * 0.65, y + r * 0.15); g.fill(); g.stroke();
      g.fillStyle = "#26222E"; g.beginPath(); g.moveTo(x - r * 0.95, y - r * 0.75); g.lineTo(x, y - r * 1.25); g.lineTo(x + r * 0.95, y - r * 0.75); g.lineTo(x, y - r * 0.45); g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
    /* boucle d'animation ; un filet de sécurité la relance si l'onglet ralentit les images */
    function frameFn(t){ stepArena(t, 0.05); if (!over) raf = requestAnimationFrame(frameFn); }
    every(() => { if (!over && (last === null || performance.now() - last > 200)) stepArena(performance.now(), 0.25); }, 100);
    function stepArena(t, maxDt){
      if (over) return;
      if (last === null) last = t;
      const dt = Math.min(maxDt, Math.max(0, (t - last) / 1000)); last = t;
      left -= dt;
      if (k.mock > 0){ k.mock -= dt; if (k.mock <= 0) pick(); }
      else {
        const dx = k.tx - k.x, dy = k.ty - k.y, dist = Math.hypot(dx, dy), stepv = P.v * dt;
        if (dist <= stepv){ k.x = k.tx; k.y = k.ty; if (Math.random() < P.p) k.mock = P.pause * A; else pick(); }
        else { k.x += dx / dist * stepv; k.y += dy / dist * stepv; if (Math.random() < 0.3) ghosts.push({ x: k.x, y: k.y, a: 0.25 }); }
      }
      if (k.hurt > 0) k.hurt -= dt;
      g.fillStyle = "#3A2B1E"; g.fillRect(0, 0, Wd, Hd);
      g.strokeStyle = "rgba(255,255,255,.06)"; g.lineWidth = 2; for (let x = 0; x < Wd; x += 60){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, Hd); g.stroke(); }
      g.strokeStyle = "rgba(245,197,24,.35)"; g.lineWidth = 4; g.beginPath(); g.arc(Wd / 2, Hd / 2, 90, 0, 7); g.stroke(); g.beginPath(); g.moveTo(Wd / 2, 0); g.lineTo(Wd / 2, Hd); g.stroke();
      for (let i = ghosts.length - 1; i >= 0; i--){ const gh = ghosts[i]; gh.a -= dt * 0.8; if (gh.a <= 0){ ghosts.splice(i, 1); continue; } drawKoro(gh.x, gh.y, R0, gh.a, false, 0); }
      drawKoro(k.x, k.y, R0, 1, k.mock > 0, k.hurt);
      if (k.mock > 0){ g.fillStyle = "#5FAF3A"; g.font = "bold 20px sans-serif"; g.textAlign = "center"; g.fillText("Nurufufu~", k.x, k.y - R0 * 1.45); }
      for (let i = floats.length - 1; i >= 0; i--){ const f = floats[i]; f.t -= dt; f.y -= 40 * dt; if (f.t <= 0){ floats.splice(i, 1); continue; } g.globalAlpha = Math.min(1, f.t * 2); g.fillStyle = f.c; g.font = "bold 24px sans-serif"; g.textAlign = "center"; g.fillText(f.s, f.x, f.y); g.globalAlpha = 1; }
      g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.arc(aim.x, aim.y, 14, 0, 7); g.moveTo(aim.x - 20, aim.y); g.lineTo(aim.x + 20, aim.y); g.moveTo(aim.x, aim.y - 20); g.lineTo(aim.x, aim.y + 20); g.stroke();
      const tl = $("#tl"); if (tl) tl.textContent = Math.max(0, left).toFixed(1).replace(".", ",") + " s";
      if (left <= 0 || S.hp <= 0 || (d.ammo <= 0 && floats.length === 0 && left < 7.5)) end();
    }
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * Wd / r.width, y: (e.clientY - r.top) * Hd / r.height }; };
    cv.onpointermove = e => { aim = pos(e); };
    cv.onpointerdown = e => {
      e.preventDefault();
      const p = pos(e); aim = p;
      if (d.ammo <= 0){ floats.push({ x: p.x, y: p.y, s: "Plus de billes !", c: "#fff", t: 0.8 }); return; }
      d.ammo--; $("#am").textContent = `Billes : ${d.ammo}`;
      const dist = Math.hypot(p.x - k.x, p.y - k.y);
      if (dist <= R0){
        if (k.mock > 0){
          const crit = dist < R0 / 3, dmg = crit ? 8 : 5;
          S.hp = Math.max(0, S.hp - dmg); d.hits++; k.hurt = 0.25; save(); refreshHp();
          floats.push({ x: k.x, y: k.y - R0, s: crit ? `CRITIQUE −${dmg}` : `−${dmg} PV`, c: crit ? "#F5C518" : "#E8741E", t: 0.9 });
          if (Math.random() < 0.5){ k.mock = 0; pick(); }
        } else {
          ghosts.push({ x: k.x, y: k.y, a: 0.5 });
          k.x = 80 + Math.random() * (Wd - 160); k.y = 70 + Math.random() * (Hd - 140); pick();
          floats.push({ x: p.x, y: p.y, s: "Esquivé !", c: "#B9C7BE", t: 0.8 });
        }
      } else floats.push({ x: p.x, y: p.y, s: "Raté", c: "#B9C7BE", t: 0.6 });
    };
    window.__arena = { k, R0, Wd, Hd, cv };
    function end(){
      if (over) return; over = true; cancelAnimationFrame(raf); clearTimers(); window.__arena = null;
      if (S.hp <= 0){ flash("K.O. !", "Koro-sensei est à terre !"); return finishExam(); }
      d.i++;
      if (d.i >= d.qs.length) finishExam(); else ask();
    }
    $("#skip").onclick = end;
    raf = requestAnimationFrame(frameFn);
  }
  function finishExam(){
    clearTimers();
    const win = S.hp <= 0;
    cur.result = win ? "win" : "lose"; S.examWin = win; save();
    paint(`<section class="act"><div class="act-head">${portraitHead("koro", win ? "ko" : "mock")}<div><div class="kicker">Examen final · bilan</div><h2 class="verdict">${win ? "Koro-sensei est atteint !" : "Koro-sensei a esquivé…"}</h2><p>${d.right} bonne${d.right > 1 ? "s" : ""} réponse${d.right > 1 ? "s" : ""} sur ${DUEL.length} · ${d.hits} tir${d.hits > 1 ? "s" : ""} au but · ${win ? "PV : 0" : "PV restants : " + Math.ceil(S.hp)}</p></div></div></section>${SPLIT}<section class="act">${ranking()}<div class="row end"><button class="btn primary" id="nx">Suite ▸</button></div></section>`);
    $("#nx").onclick = next;
  }
  if (d.i < 0) intro(); else ask();
};

/* ---------- tentative d'assassinat de fin de chapitre ---------- */
function assault(pct, then){
  const ch = chap();
  const zone = 0.12 + 0.3 * pct, center = 0.5;
  const speed = (0.55 + ch.no * 0.12) * (RM ? 0.5 : 1);
  let p = 0, dir = 1, raf = null, last = null, done = false;
  let lead = 0; S.teams.forEach((t, i) => { if (t.pts > S.teams[lead].pts) lead = i; });
  const who = teamsOn() ? `${S.teams[lead].name}, en tête du classement, envoie un représentant frapper.` : `${S.name}, à toi de frapper.`;
  paint(`<section class="act"><div class="kicker">Tentative d’assassinat · fin du chapitre ${ch.no}</div><h2>Koro-sensei esquive à Mach 20 !</h2>
    <p>Votre score du chapitre (${Math.round(pct * 100)} %) a élargi la zone de frappe. Frappez quand il passe dans la zone orange. Au centre : coup critique.</p>
    <div class="track" aria-hidden="true"><div class="zone" style="left:${(center - zone / 2) * 100}%;width:${zone * 100}%"></div><div class="crit" style="left:${(center - zone / 6) * 100}%;width:${zone / 3 * 100}%"></div><div class="target" id="tg">${koro("mock")}</div></div></section>${SPLIT}<section class="act">
    <p>${esc(who)} (Espace ou clic)</p><div id="fb"></div><div class="row end" id="act-row"><button class="btn primary strike-btn" id="strike">Frapper !</button></div></section>`);
  function tick(t){
    if (done) return;
    if (last === null) last = t;
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    p += dir * speed * dt;
    if (p > 1){ p = 1; dir = -1; } if (p < 0){ p = 0; dir = 1; }
    const tg = $("#tg"); if (!tg) return;
    tg.style.left = (p * 100) + "%";
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  $("#strike").onclick = () => {
    if (done) return;
    done = true; cancelAnimationFrame(raf);
    const gap = Math.abs(p - center), crit = gap <= zone / 6, hit = gap <= zone / 2;
    if (hit){
      S.hp = Math.max(0, S.hp - (crit ? 10 : 6));
      if (teamsOn()){ S.teams[lead].pts = Math.round((S.teams[lead].pts + (crit ? 2 : 1)) * 10) / 10; const tb = $("#app .teambar"); if (tb) tb.outerHTML = teamBar(); }
      save(); refreshHp();
    }
    $("#tg").innerHTML = koro(hit ? "ko" : "mock");
    flash(crit ? "COUP CRITIQUE !" : hit ? "TOUCHÉ !" : "ESQUIVÉ !", crit ? "−10 PV pour Koro-sensei" : hit ? "−6 PV pour Koro-sensei" : "Nurufufu… trop lent !");

function walkable(c, r){
  const t = tileAt(c, r);

  if (SOLID.has(t)) return false;

function goTo(x, y, npc){
  const sc = Math.floor(S.px / TILE), sr = Math.floor(S.py / TILE);
  let goals;
  if (npc){ const nc = Math.floor(npc.x / TILE), nr = Math.floor(npc.y / TILE); goals = [[nc, nr + 1], [nc + 1, nr], [nc - 1, nr], [nc, nr - 1]].filter(([c, r]) => walkable(c, r)); }
  else goals = [[Math.floor(x / TILE), Math.floor(y / TILE)]].filter(([c, r]) => walkable(c, r));
  if (!goals.length) return;
  const key = (c, r) => r * COLS + c, prev = new Map([[key(sc, sr), null]]), queue = [[sc, sr]];
  let found = null;
  while (queue.length){
    const [c, r] = queue.shift();
    if (goals.some(([gc, gr]) => gc === c && gr === r)){ found = [c, r]; break; }
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
      const nc = c + dc, nr = r + dr, k = key(nc, nr);
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || prev.has(k) || !walkable(nc, nr)) return;
      prev.set(k, [c, r]); queue.push([nc, nr]);

  }
  if (!found) return;
  const route = []; let p = found;
  while (p && !(p[0] === sc && p[1] === sr)){ route.unshift(p); p = prev.get(key(p[0], p[1])); }
  path = route; autoTalk = npc ? npc.id : null;
  if (!route.length && npc) interact();
}
