    try { navigator.clipboard.writeText(ta.value).then(() => { $("#copied").textContent = "Copié."; }, fb); } catch(e){ fb(); }
  };
}
function renderGuide(){
  cur = null;
  paint(`<section class="act"><div class="act-head">${portraitHead("karasuma")}<div><div class="kicker">Pour le groupe qui anime</div><h1 style="font-size:30px">Guide de l’animateur</h1></div></div></section>${SPLIT}<section class="act">
    <div class="memo"><h3>Déroulé conseillé (environ 60 minutes)</h3><ul>
      <li><b>5 min · Lancement.</b> Projetez le jeu, choisissez « Classe en équipes » et le mode Affrontement, formez des groupes de 3 à 5. Un élève tient le clavier et déplace le personnage ; la classe le guide.</li>
      <li><b>14 min · Chapitre 1 (Koro-sensei).</b> Processus, méthode de Harvard, laboratoire de ZOPA, calcul de la MESORE.</li>
      <li><b>12 min · Chapitre 2 (Nagisa).</b> Lecture de signaux non verbaux, puis entraînement éclair « Signal ou certitude ? ».</li>
      <li><b>12 min · Chapitre 3 (Karma, puis Claire Lefort).</b> Échauffement « Repère la tactique », décision sur le cadeau, puis négociation en temps réel : la patience de Claire baisse, il faut cliquer « Observer » pendant ses micro-expressions.</li>
      <li><b>10 min · Chapitre 4 (Irina, puis le directeur Asano).</b> Cinq dossiers éthiques, puis la pression du directeur. Les choix modifient la jauge de Confiance et l’histoire.</li>
      <li><b>7 min · Chapitre 5 (gymnase).</b> Examen final : les bonnes réponses donnent des billes, puis la classe tire sur Koro-sensei quand il se moque. Fin selon la Confiance et le résultat.</li>
    </ul></div>
    <div class="memo"><h3>Critères du cahier des charges</h3><div class="tablewrap" style="border-width:2px"><table><thead><tr><th>Critère</th><th>Ce que le jeu apporte</th></tr></thead><tbody>
      <tr><td>Rigueur et maîtrise</td><td>Chaque réponse est suivie d’une explication sourcée (Fisher et Ury, Mehrabian, Hall, Ekman, Sapin II, Code de commerce, Code civil, devoir de vigilance, ISO 20400).</td></tr>
      <tr><td>Application concrète</td><td>Un achat chiffré de 30 ordinateurs, une négociation complète en temps réel, des dilemmes éthiques aux conséquences visibles.</td></tr>
      <tr><td>Efficacité pédagogique</td><td>Toutes les équipes répondent à chaque question et débattent ; explications systématiques ; carnet de révision.</td></tr>
      <tr><td>Créativité adaptée</td><td>L’univers d’Assassination Classroom sert l’apprentissage : explorer l’école, lire les micro-expressions, tirer quand Koro-sensei se moque, 5 fins selon l’éthique.</td></tr>
      <tr><td>Engagement collectif</td><td>Groupes de 3 à 5, scores par équipe, Combo 3-E, choix éthiques décidés à la majorité de la classe.</td></tr>
      <tr><td>Organisation</td><td>Déroulé minuté, chronos réglables, tir assisté, menu « Aller à un chapitre » pour gérer le temps.</td></tr>
    </tbody></table></div></div>
    <div class="memo"><h3>Les livrables</h3><ul>
      <li><b>01 Animation ludopédagogique</b> : le jeu.</li>
      <li><b>Exemple concret</b> : l’achat de 30 ordinateurs portables auprès de Pixelia.</li>
      <li><b>03 Vérification des acquis</b> : l’examen final au gymnase et les entraînements éclair.</li>
      <li><b>04 Consolidation</b> : le carnet de Nagisa, avec les personnages et les sources (à faire valider avant diffusion).</li>
    </ul></div></section>`);
}
function renderMenu(){
  cur = null;
  let armed = false;
  paint(`<section class="act"><div class="kicker">Menu</div><h1 style="font-size:30px">Options de partie</h1></section>${SPLIT}<section class="act">
    <div class="memo"><h3>Aller à un chapitre (animateur)</h3><p>Pratique pour gérer le temps de la séance ou reprendre une partie précise.</p>
      <div class="row" style="margin-top:10px">${QUESTS.slice(0, 8).map((q, i) => `<button class="btn small" data-jump="${i}">${["Chap. 1", "Chap. 2", "Échauffement", "Négociation", "Éthique", "Directeur", "Karasuma", "Examen"][i]}</button>`).join("")}</div></div>
    <div class="memo"><h3>Accessibilité</h3><div class="row"><label class="toggle"><input type="checkbox" id="m-notimer" ${S.noTimer ? "checked" : ""}> Sans chrono (questions et patience)</label><label class="toggle"><input type="checkbox" id="m-assist" ${S.assist ? "checked" : ""}> Tir assisté</label></div></div>
    <div class="row end"><button class="btn ghost" id="m-title">Écran titre</button><button class="btn ghost" id="m-reset">Recommencer à zéro</button><button class="btn primary" id="m-back">Reprendre</button></div></section>`);
  $$("[data-jump]").forEach(b => b.onclick = () => {
    S.q = +b.dataset.jump;
    const n = npcs().find(n => n.id === QUESTS[S.q].npc);
    if (n){ const spot = [[0, 40], [40, 0], [-40, 0], [0, -40], [40, 40], [-40, 40]].map(([dx, dy]) => [n.x + dx, n.y + dy]).find(([x, y]) => !blocked(x, y)); if (spot){ S.px = spot[0]; S.py = spot[1]; } }
    save(); closeMission(false); toast("Objectif : " + QUESTS[S.q].obj);
  });
  $("#m-notimer").onchange = e => { S.noTimer = e.target.checked; save(); };
  $("#m-assist").onchange = e => { S.assist = e.target.checked; save(); };
  $("#m-back").onclick = () => closeMission(false);
  $("#m-title").onclick = () => { closeMission(false); renderTitle(); };
  $("#m-reset").onclick = () => {
    if (!armed){ armed = true; $("#m-reset").textContent = "Confirmer : tout effacer"; return; }
    const keep = { name: S.name, mode: S.mode, answerMode: S.answerMode, teams: S.teams.map(t => ({ ...t, pts: 0 })) };
    S = Object.assign(FRESH(), keep); save(); closeMission(false); renderTitle();
  };
}
function credits(){
  return `<p class="credits">Fan-jeu pédagogique non commercial, réalisé pour un cours de Master GPLA. Univers et personnages inspirés du manga <i>Assassination Classroom</i> (<i>Ansatsu Kyōshitsu</i>) de Yūsei Matsui, publié par Shūeisha ; ils restent la propriété de leurs auteurs. Illustrations et code originaux. Claire Lefort, Pixelia, Datalis et l’étude de cas sont fictifs.</p>`;
}

/* ---------- écran titre ---------- */
function renderTitle(){
  cancelAnimationFrame(rafW);
  const has = S.started;
  const defaults = ["Équipe Nagisa", "Équipe Karma", "Équipe Kayano", "Équipe Sugino", "Équipe Okuda", "Équipe Isogai", "Équipe Kanzaki", "Équipe Terasaka"];
  const draft = defaults.map((d, i) => ({ name: (S.teams[i] && S.teams[i].name) || d, members: (S.teams[i] && S.teams[i].members) || "" }));
  let count = S.teams.length > 1 ? S.teams.length : 4;
  root.innerHTML = `<div class="wrap"><section>
    <div class="hero">
      <div><div style="font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--koro)">Ludopédagogie · Master GPLA · Achats</div>
        <h1>Classe 3-E : <em>Opération Négociation</em></h1><div class="chalkline"></div>
        <p class="lede">Explore l’école de la classe 3-E, accepte les missions de Koro-sensei et de ses élèves, négocie en temps réel avec Claire Lefort, résiste aux pressions… puis affronte Koro-sensei au gymnase. Tes choix éthiques décident de la fin.</p></div>
      <div class="cast"><figure class="big"><div class="panel">${koro("normal")}</div><figcaption>Koro-sensei</figcaption></figure>
        <figure><div class="panel">${CAST.nagisa.svg}</div><figcaption>Nagisa</figcaption></figure>
        <figure><div class="panel">${CAST.karma.svg}</div><figcaption>Karma</figcaption></figure>
        <figure><div class="panel">${CAST.lefort.svg}</div><figcaption>Claire Lefort</figcaption></figure></div>
    </div>
    <form id="start" class="setup">
      <fieldset><legend>Mode de jeu</legend>
        <label class="radio"><input type="radio" name="mode" id="mode-solo" value="solo" ${S.mode !== "teams" ? "checked" : ""}> Solo</label>
        <div class="field"><label for="player-name">Ton prénom</label><input id="player-name" maxlength="20" value="${esc(S.name)}"></div>
        <label class="radio"><input type="radio" name="mode" id="mode-teams" value="teams" ${S.mode === "teams" ? "checked" : ""}> Classe en équipes (projeté au tableau)</label>
      </fieldset>
      <fieldset><legend>Équipes (groupes de 3 à 5)</legend>
        <div class="field"><label for="team-count">Nombre d’équipes</label><select id="team-count">${[2,3,4,5,6,7,8].map(n => `<option value="${n}" ${count === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
        <div class="field"><span style="font-weight:700">Façon de répondre</span>
          <label class="radio"><input type="radio" name="amode" id="amode-all" value="all" ${S.answerMode !== "turns" ? "checked" : ""}> Affrontement : toutes les équipes répondent en même temps</label>
          <label class="radio"><input type="radio" name="amode" id="amode-turns" value="turns" ${S.answerMode === "turns" ? "checked" : ""}> Tour par tour : une équipe par question</label></div>
        <div class="team-rows" id="team-rows"></div>
      </fieldset>
      <div class="row" style="grid-column:1/-1"><button class="btn primary" type="submit">${has ? "Continuer la partie" : "Entrer à l’école"}</button>${has ? `<button class="btn ghost" type="button" id="fresh">Nouvelle partie</button>` : ""}</div>
    </form>${credits()}</section></div>`;
  function readRows(){ $$("[data-tname]").forEach(el => { draft[+el.dataset.tname].name = el.value; }); $$("[data-tmem]").forEach(el => { draft[+el.dataset.tmem].members = el.value; }); }
  function rows(){ $("#team-rows").innerHTML = draft.slice(0, count).map((t, i) => `<div class="team-row"><div class="field"><label for="team-${i}">Équipe ${i + 1}</label><input id="team-${i}" data-tname="${i}" maxlength="24" value="${esc(t.name)}"></div><div class="field"><label for="members-${i}">Membres (3 à 5 prénoms)</label><input id="members-${i}" data-tmem="${i}" maxlength="80" placeholder="Léa, Hugo, Inès…" value="${esc(t.members)}"></div></div>`).join(""); }
  $("#team-count").onchange = e => { readRows(); count = +e.target.value; rows(); };
  rows();
  function apply(){
    readRows();
    S.mode = $("#mode-teams").checked ? "teams" : "solo";
    S.answerMode = $("#amode-turns").checked ? "turns" : "all";
    S.name = ($("#player-name").value || "").trim().slice(0, 20) || "Élève";
    if (S.mode === "teams"){
      const old = S.teams;
      S.teams = draft.slice(0, count).map((t, i) => ({ name: t.name.trim() || defaults[i], members: t.members.trim(), pts: (old[i] && old[i].pts) || 0 }));
      if (S.turn >= count) S.turn = 0;
    }
    save();
  }
  $("#start").onsubmit = e => {
    e.preventDefault(); apply();
    renderWorld();
    if (!S.started){ S.started = true; save(); startChapter("c0"); }
  };
  if ($("#fresh")) $("#fresh").onclick = () => {
    apply();
    const keep = { name: S.name, mode: S.mode, answerMode: S.answerMode, teams: S.teams.map(t => ({ ...t, pts: 0 })) };
    S = Object.assign(FRESH(), keep, { started: true }); save();
    renderWorld(); startChapter("c0");
  };
}

/* ---------- clavier ---------- */
document.addEventListener("keydown", e => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const typingField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (!ov.hidden){
    if (e.key === "o" || e.key === "O"){ if (window.__obs){ e.preventDefault(); window.__obs(); } return; }
    if (e.key === " " && $("#strike")){ e.preventDefault(); $("#strike").click(); return; }
    if ((e.key === "Enter" || e.key === " ") && (document.activeElement === document.body || document.activeElement === ov)){ const b = $("#nx"); if (b && !b.hidden){ e.preventDefault(); b.click(); } }
    return;
  }
  if (typingField) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) e.preventDefault();
  if (k === "e" || k === "Enter" || k === " "){ interact(); return; }
  keys[k] = true;
});
document.addEventListener("keyup", e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
window.addEventListener("blur", () => { keys = {}; });

load();
renderTitle();
})();
</script>
